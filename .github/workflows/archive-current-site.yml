name: Archive current site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/archive/**

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pages and original uploads
        run: python tools/archive/archive.py archive

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet && exit 0
          git commit -m "Archive pulsanalys.se pages and original uploads"
          git push
